<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARIPESA VIP - Accès Pronostics</title>
    <style>
        :root {
            --primary-blue: #003366;
            --accent-blue: #0056b3;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .logo-area h1 {
            font-size: 22px;
            color: var(--primary-blue);
            margin: 10px 0 5px 0;
        }

        .logo-area p {
            font-size: 13px;
            color: #666;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #e1e4e8;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: var(--accent-blue);
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: var(--primary-blue);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-blue);
        }

        .alert {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            text-align: left;
            display: none;
        }

        .alert-error {
            background-color: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
        }

        .alert-warning {
            background-color: #fffaf0;
            color: #dd6b20;
            border: 1px solid #fbd38d;
        }

        .alert-success {
            background-color: #f0fff4;
            color: #276749;
            border: 1px solid #9ae6b4;
            text-align: center;
            font-weight: bold;
        }

        .signals-box {
            margin-top: 20px;
            padding: 15px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            text-align: left;
            display: none;
        }

        .signals-box h3 {
            font-size: 15px;
            color: var(--primary-blue);
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <h1>⚽ PARIPESA VIP</h1>
            <p>Accès exclusif aux pronostics & coupons VIP</p>
        </div>

        <div class="input-group">
            <input type="text" id="playerId" placeholder="Ex: 383105325">
        </div>

        <button id="verifyBtn" onclick="verifyId()">VÉRIFIER MON ACCÈS</button>

        <!-- Messages d'état -->
        <div id="alertBox" class="alert"></div>

        <!-- Section des pronostics si validé -->
        <div id="signalsBox" class="signals-box">
            <h3>🎯 VOS COUPONS DU JOUR</h3>
            <div id="signalsContent">Chargement des pronostics...</div>
        </div>
    </div>

    <script>
        // URL de ton Cloudflare Worker connectée
        const WORKER_URL = "https://teams-paris-pesa.lucsckoba.workers.dev";

        async function verifyId() {
            const idInput = document.getElementById("playerId").value.trim();
            const alertBox = document.getElementById("alertBox");
            const signalsBox = document.getElementById("signalsBox");
            const signalsContent = document.getElementById("signalsContent");

            alertBox.style.display = "none";
            signalsBox.style.display = "none";

            if (!idInput || !/^\d+$/.test(idInput)) {
                alertBox.className = "alert alert-error";
                alertBox.innerHTML = "❌ <b>Champ invalide</b><br>Veuillez entrer un ID joueur PariPesa valide (chiffres uniquement).";
                alertBox.style.display = "block";
                return;
            }

            document.getElementById("verifyBtn").innerText = "Vérification en cours...";

            try {
                // Appel vers ton Worker Cloudflare
                const response = await fetch(`${WORKER_URL}?id=${idInput}`);
                const data = await response.json();

                if (!data.registered) {
                    alertBox.className = "alert alert-error";
                    alertBox.innerHTML = "❌ <b>ACCÈS REFUSÉ</b><br>Cet ID n'est pas rattaché au code promo <b>ZIKOONE</b>.<br><br>1. Crée un nouveau compte avec le code <b>ZIKOONE</b>.<br>2. Effectue ton premier dépôt.";
                    alertBox.style.display = "block";
                } else if (data.deposit === 0) {
                    alertBox.className = "alert alert-warning";
                    alertBox.innerHTML = "⚠️ <b>PREMIER DÉPÔT REQUIS</b><br>Ton ID est bien rattaché au code <b>ZIKOONE</b>, mais ton premier dépôt n'a pas encore été détecté.<br><br>Recharge ton compte puis réessaie.";
                    alertBox.style.display = "block";
                } else {
                    alertBox.className = "alert alert-success";
                    alertBox.innerHTML = "✅ ACCÈS VÉRIFIÉ AVEC SUCCÈS !";
                    alertBox.style.display = "block";

                    // Charger les pronostics depuis le worker
                    const sigResponse = await fetch(`${WORKER_URL}/get-signals`);
                    const sigData = await sigResponse.json();

                    signalsContent.innerHTML = `<pre style="white-space: pre-wrap; font-family: inherit; margin: 0;">${sigData.signals ? sigData.signals.join('\n') : sigData.sessionName || "Aucun pronostic disponible pour l'instant."}</pre>`;
                    signalsBox.style.display = "block";
                }
            } catch (err) {
                alertBox.className = "alert alert-error";
                alertBox.innerHTML = "❌ Erreur de connexion avec le serveur de vérification.";
                alertBox.style.display = "block";
            } finally {
                document.getElementById("verifyBtn").innerText = "VÉRIFIER MON ACCÈS";
            }
        }
    </script>
</body>
</html>
